# This file is included via the manifest
include:
  # For PRs in this repo: We use the base spack config from access-spack-packages
  - git: https://github.com/ACCESS-NRI/access-spack-packages
    branch: 484-top-level-includes
    paths:
    - .github/build-ci/include/base
    when: "'USE_CALLER_REPOSITORY_CONFIG_PATH' not in env"

  # For PRs in special repos that source manifests from this repo: Use spack config from the caller instead, from an env set in build-ci
  - path: $CALLER_REPOSITORY_CONFIG_PATH
    when: "'USE_CALLER_REPOSITORY_CONFIG_PATH' in env"
